# Demo gateway for `docker compose up`: full security pipeline + rule optimizer + Redis cache.
# Uses the rule injection detector so the image needs no ML libraries (switch `detector` to
# deberta/combined after installing the ml group and training, see README).
servers:
  wealth: {transport: streamable_http, url: http://wealth:8001/mcp}
  malicious: {transport: streamable_http, url: http://malicious:8002/mcp, enabled: false}
agents:
  assistant: {token_env: AGENT_TOKEN_ASSISTANT}
  redteam: {token_env: AGENT_TOKEN_REDTEAM}
default_agent: anonymous
policies_file: ../policies.yaml
approval_timeout_s: 120
admin_token_env: ADMIN_TOKEN
cors_origins: ["http://localhost:4200"]
cache: {enabled: true, ttl_s: 300}
pipeline:
  request: [auth, pii_mask, policy, injection_scan, audit]
  response: [optimizer, pii_mask, injection_scan, metrics]   # compress -> filter (faster, see REPORT.md)
middlewares:
  pii_mask: {entities: [IBAN_CODE, EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, US_SSN], min_score: 0.5, model: en_core_web_sm}
  injection_scan: {detector: rules, threshold: 0.5, on_description: hide, on_argument: block, on_response: sanitize}
  optimizer: {pruning: rules, serialization: compact, evidence_recovery: true, rules_file: ../pruning_rules.yaml}
  metrics: {input_price_per_mtok_usd: 0.30}
