[project]
name = "aegis-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "faker==40.54.0",
    "fastapi==0.164.0",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
python_version = "3.12"
files = ["servers", "gateway", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gateway.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: needs real Postgres/Redis (docker compose)"]

[tool.coverage.run]
source = ["servers", "gateway"]
branch = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
