[project]
name = "aegis-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "en-core-web-sm",
    "faker==40.54.0",
    "fastapi==0.164.0",
    "mcp==2.3.0",
    "presidio-analyzer==2.2.366",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "redis==6.4.0",
    "sqlalchemy[asyncio]==2.1.9",
    "tiktoken==0.14.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
agents = [
    "httpx==0.28.1",
    "openai-agents[litellm]==0.25.0",
]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]
ml = [
    "accelerate==1.16.0",
    "datasets==5.2.0",
    "joblib==1.6.0",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "protobuf==7.36.2",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.3.0",
    "sentencepiece==0.2.3",
    "torch==2.14.1",
    "transformers==5.23.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
python_version = "3.12"
files = ["servers", "gateway", "tests", "aegis_agents", "evaluation"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gateway.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: needs real Postgres/Redis (docker compose)"]

[tool.coverage.run]
source = ["servers", "gateway", "aegis_agents", "evaluation"]
branch = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.per-file-ignores]
# Research scripts with long table/metadata literals kept on one line for readability.
"ml/**" = ["E501"]
"evaluation/final_report.py" = ["E501"]
"evaluation/attacks.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "joblib", "joblib.*", "lightgbm", "lightgbm.*", "sklearn", "sklearn.*", "sentence_transformers", "datasets", "transformers", "torch", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
